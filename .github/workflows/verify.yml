name: Verify application
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/wohnly_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm test
      - run: npm run build:api
      - run: npm run typecheck
      - run: npm run lint
      - name: Validate iOS native generation
        working-directory: apps/mobile
        run: |
          npx expo prebuild --platform ios --no-install
          grep -q EXExpoAppSceneDelegate ios/Wohnly/Info.plist
      - run: npm run build:web
