# Attach a processed MAS build to the macOS App Store version and submit for review.
# Handles stuck UNRESOLVED_ISSUES submissions by canceling them first (ASC requirement).
name: ASC macOS resubmit

on:
  workflow_dispatch:
    inputs:
      version:
        description: App Store version and CFBundleVersion (must match)
        required: true
        default: "1.3.10"
      app_id:
        description: ASC app ID
        required: true
        default: "6761035211"

jobs:
  resubmit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Write ASC API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.ASC_API_KEY_P8 }}" | base64 -d > ~/.private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Attach build and submit for review
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          VERSION: ${{ inputs.version }}
          APP_ID: ${{ inputs.app_id }}
        run: |
          pip3 install --quiet PyJWT cryptography
          python3 <<'PY'
          import json, time, urllib.error, urllib.request
          from pathlib import Path
          import jwt
          import os

          KEY_ID = os.environ["ASC_API_KEY_ID"]
          ISSUER = os.environ["ASC_API_ISSUER_ID"]
          KEY = Path(f"~/.private_keys/AuthKey_{KEY_ID}.p8").expanduser().read_text()
          APP_ID = os.environ["APP_ID"]
          VERSION = os.environ["VERSION"]

          def tok():
              n = int(time.time())
              return jwt.encode(
                  {"iss": ISSUER, "iat": n, "exp": n + 1200, "aud": "appstoreconnect-v1"},
                  KEY,
                  algorithm="ES256",
                  headers={"kid": KEY_ID, "typ": "JWT"},
              )

          def api(path, method="GET", body=None, soft=False):
              data = None if body is None else json.dumps(body).encode()
              req = urllib.request.Request(
                  "https://api.appstoreconnect.apple.com" + path,
                  data=data,
                  method=method,
                  headers={
                      "Authorization": f"Bearer {tok()}",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      raw = r.read()
                      return json.loads(raw) if raw else {"_ok": True, "status": r.status}
              except urllib.error.HTTPError as e:
                  err = e.read().decode()
                  print(f"HTTP {e.code} {method} {path}\n{err[:3000]}")
                  if soft:
                      return {"_e": e.code, "_b": err}
                  raise SystemExit(1)

          # Resolve the App Store version from the same value used by the build.
          versions = api(
              f"/v1/apps/{APP_ID}/appStoreVersions"
              f"?filter[platform]=MAC_OS&filter[versionString]={VERSION}&limit=10"
          )
          matches = versions.get("data", [])
          if not matches:
              print("Creating macOS App Store version", VERSION)
              created_version = api(
                  "/v1/appStoreVersions",
                  "POST",
                  {
                      "data": {
                          "type": "appStoreVersions",
                          "attributes": {
                              "platform": "MAC_OS",
                              "versionString": VERSION,
                          },
                          "relationships": {
                              "app": {"data": {"type": "apps", "id": APP_ID}}
                          },
                      }
                  },
              )
              matches = [created_version["data"]]
          if len(matches) != 1:
              raise SystemExit(
                  f"Expected one macOS App Store version {VERSION}, found {len(matches)}"
              )
          MAC_VER = matches[0]["id"]
          BUILD_VERSION = VERSION
          print("Resolved App Store version", VERSION, MAC_VER)

          # Wait for build processing
          build_id = None
          state = None
          for i in range(40):
              builds = api(
                  f"/v1/builds?filter[app]={APP_ID}&sort=-uploadedDate&limit=15"
                  "&fields[builds]=version,uploadedDate,processingState,buildAudienceType"
              )
              print(f"--- poll builds {i} ---")
              for b in builds.get("data", []):
                  a = b["attributes"]
                  ver = str(a.get("version") or "")
                  state = a.get("processingState")
                  print(b["id"], ver, state, a.get("uploadedDate"))
                  if ver == BUILD_VERSION:
                      build_id = b["id"]
                      if state == "VALID":
                          break
                      if state in ("FAILED", "INVALID"):
                          raise SystemExit(f"Build {BUILD_VERSION} processing failed: {state}")
              else:
                  time.sleep(30)
                  continue
              if build_id and state == "VALID":
                  break
              time.sleep(30)

          if not build_id:
              raise SystemExit(f"Build {BUILD_VERSION} not found after polling")

          print("Attaching build", build_id, "to version", MAC_VER)
          api(
              f"/v1/appStoreVersions/{MAC_VER}/relationships/build",
              "PATCH",
              {"data": {"type": "builds", "id": build_id}},
          )
          print("Build attached")

          # Cancel stuck submissions that own the version
          # UNRESOLVED_ISSUES cannot accept new items; must cancel then create fresh.
          ACTIVE = {"WAITING_FOR_REVIEW", "IN_REVIEW"}
          CANCELABLE = {"READY_FOR_REVIEW", "UNRESOLVED_ISSUES"}
          PENDING = CANCELABLE | ACTIVE | {"CANCELING"}

          subs = api(
              f"/v1/apps/{APP_ID}/reviewSubmissions?filter[platform]=MAC_OS&limit=15"
          )
          for s in subs.get("data", []):
              st = s["attributes"].get("state")
              print("existing submission", s["id"], st)
              if st in ACTIVE:
                  raise SystemExit(
                      f"Active review in progress ({st}): {s['id']}. Cancel in ASC UI first."
                  )

          for s in subs.get("data", []):
              st = s["attributes"].get("state")
              if st not in CANCELABLE:
                  continue
              sid = s["id"]
              print("Canceling submission", sid, st)
              api(
                  f"/v1/reviewSubmissions/{sid}",
                  "PATCH",
                  {
                      "data": {
                          "type": "reviewSubmissions",
                          "id": sid,
                          "attributes": {"canceled": True},
                      }
                  },
              )
              for _ in range(30):
                  cur = api(f"/v1/reviewSubmissions/{sid}", soft=True)
                  if cur.get("_e") == 404:
                      print("  cancel poll: gone (404) — settled")
                      break
                  if cur.get("_e"):
                      raise SystemExit(1)
                  cst = cur["data"]["attributes"].get("state")
                  print("  cancel poll:", cst)
                  if cst not in PENDING:
                      break
                  time.sleep(2)

          # Create fresh submission
          created = api(
              "/v1/reviewSubmissions",
              "POST",
              {
                  "data": {
                      "type": "reviewSubmissions",
                      "attributes": {"platform": "MAC_OS"},
                      "relationships": {
                          "app": {"data": {"type": "apps", "id": APP_ID}}
                      },
                  }
              },
          )
          submission_id = created["data"]["id"]
          print("Created submission", submission_id)

          # Attach version item (relationship key is appStoreVersion singular in v1)
          add = api(
              "/v1/reviewSubmissionItems",
              "POST",
              {
                  "data": {
                      "type": "reviewSubmissionItems",
                      "relationships": {
                          "reviewSubmission": {
                              "data": {
                                  "type": "reviewSubmissions",
                                  "id": submission_id,
                              }
                          },
                          "appStoreVersion": {
                              "data": {
                                  "type": "appStoreVersions",
                                  "id": MAC_VER,
                              }
                          },
                      },
                  }
              },
              soft=True,
          )
          if add.get("_e"):
              # Some ASC tenants expect plural relationship key
              print("Retrying with appStoreVersions relationship key")
              add = api(
                  "/v1/reviewSubmissionItems",
                  "POST",
                  {
                      "data": {
                          "type": "reviewSubmissionItems",
                          "relationships": {
                              "reviewSubmission": {
                                  "data": {
                                      "type": "reviewSubmissions",
                                      "id": submission_id,
                                  }
                              },
                              "appStoreVersions": {
                                  "data": {
                                      "type": "appStoreVersions",
                                      "id": MAC_VER,
                                  }
                              },
                          },
                      }
                  },
              )
          print("Added appStoreVersion item")

          # Finalize: PATCH submitted=true (preferred over /submit)
          submitted = api(
              f"/v1/reviewSubmissions/{submission_id}",
              "PATCH",
              {
                  "data": {
                      "type": "reviewSubmissions",
                      "id": submission_id,
                      "attributes": {"submitted": True},
                  }
              },
          )
          print("SUBMITTED")
          print(json.dumps(submitted, indent=2)[:4000])

          ver = api(f"/v1/appStoreVersions/{MAC_VER}")
          print(
              "version state:",
              ver["data"]["attributes"].get("appStoreState"),
              "version:",
              ver["data"]["attributes"].get("versionString"),
          )
          sub = api(f"/v1/reviewSubmissions/{submission_id}")
          print("submission state:", sub["data"]["attributes"].get("state"))
          PY
