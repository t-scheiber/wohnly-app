name: Inspect macOS candidate processing

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: ASC app ID
        required: true
        default: "6761035211"
      build:
        description: CFBundleVersion to inspect
        required: true
        default: "1.3.12"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query App Store Connect build state
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APP_ID: ${{ inputs.app_id }}
          BUILD_VERSION: ${{ inputs.build }}
        run: |
          set -euo pipefail
          pip3 install --quiet PyJWT cryptography
          python3 <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.parse
          import urllib.request
          import jwt

          key_id = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_API_ISSUER_ID"]
          raw_key = base64.b64decode(os.environ["ASC_API_KEY_P8"]).decode()
          app_id = os.environ["APP_ID"]
          build_version = os.environ["BUILD_VERSION"]

          token = jwt.encode(
              {
                  "iss": issuer,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              raw_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )
          query = urllib.parse.urlencode(
              {
                  "filter[app]": app_id,
                  "filter[version]": build_version,
                  "limit": "10",
              }
          )
          request = urllib.request.Request(
              f"https://api.appstoreconnect.apple.com/v1/builds?{query}",
              headers={"Authorization": f"Bearer {token}"},
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              payload = json.load(response)
          builds = [
              {
                  "id": build["id"],
                  "version": build["attributes"].get("version"),
                  "processingState": build["attributes"].get("processingState"),
                  "uploadedDate": build["attributes"].get("uploadedDate"),
                  "expired": build["attributes"].get("expired"),
              }
              for build in payload.get("data", [])
          ]
          print(json.dumps({"builds": builds}, sort_keys=True))
          PY
