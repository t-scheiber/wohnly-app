name: Build & Deploy Desktop (macOS + Windows)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/lib/**"
      - "apps/mobile/components/**"
      - "apps/mobile/constants/**"
      - "apps/mobile/hooks/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/i18n/**"
      - "apps/desktop/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - all
          - macos
          - windows
      submit:
        description: "Submit to stores after build"
        required: false
        type: boolean
        default: false

jobs:
  build-web:
    name: Build web export
    if: vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install sharp for icon generation
        run: npm install --no-save sharp

      - name: Generate Tauri icons
        run: node apps/desktop/generate-icons.mjs

      - name: Export web build
        working-directory: apps/mobile
        run: npx expo export --platform web
        env:
          EXPO_PUBLIC_ADSENSE_BANNER_SLOT: ${{ vars.ADSENSE_BANNER_SLOT || secrets.ADSENSE_BANNER_SLOT }}
          EXPO_PUBLIC_DESKTOP_PRO_PRODUCT_ID: wohnly_pro_lifetime

      - name: Apply web metadata and mobile viewport
        working-directory: apps/mobile
        run: node scripts/inject-adsense.mjs

      - name: Add PWA assets
        working-directory: apps/desktop
        run: bash build-pwa.sh

      - name: Upload web dist
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: apps/mobile/dist
          retention-days: 1

      - name: Upload Tauri icons
        uses: actions/upload-artifact@v7
        with:
          name: tauri-icons
          path: apps/desktop/tauri/icons
          retention-days: 1

      - name: Upload MSIX icon assets
        uses: actions/upload-artifact@v7
        with:
          name: tauri-icons-msix
          path: apps/desktop/msix/assets
          retention-days: 1

  # -- macOS: build, sign, notarize, optionally submit to Mac App Store --

  build-macos:
    name: Build & sign macOS
    needs: build-web
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/mobile/dist

      - uses: actions/download-artifact@v8
        with:
          name: tauri-icons
          path: apps/desktop/tauri/icons

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build Tauri app (signed)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --verbose

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-build
          path: |
            apps/desktop/tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/tauri/target/release/bundle/macos/*.app
            apps/desktop/tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  submit-macos:
    name: Submit to Mac App Store
    needs: build-macos
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.submit &&
      (inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: artifacts/macos

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' apps/desktop/tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Import Mac App Store certificates
        env:
          MAS_APP_CERT: ${{ secrets.APPLE_MAS_APP_CERTIFICATE }}
          MAS_APP_CERT_PASSWORD: ${{ secrets.APPLE_MAS_APP_CERTIFICATE_PASSWORD }}
          MAS_INSTALLER_CERT: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE }}
          MAS_INSTALLER_CERT_PASSWORD: ${{ secrets.APPLE_MAS_INSTALLER_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PASSWORD" mas.keychain
          security default-keychain -s mas.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" mas.keychain

          echo "$MAS_APP_CERT" | base64 --decode > mas_app.p12
          security import mas_app.p12 -k mas.keychain -P "$MAS_APP_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm mas_app.p12

          echo "$MAS_INSTALLER_CERT" | base64 --decode > mas_installer.p12
          security import mas_installer.p12 -k mas.keychain -P "$MAS_INSTALLER_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/productbuild
          rm mas_installer.p12

          security set-key-partition-list -S apple-tool:,apple:,codesign:,productbuild: -s -k "$KEYCHAIN_PASSWORD" mas.keychain

          curl -fsSL -o AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import AppleWWDRCAG3.cer -k mas.keychain -A

      - name: Write ASC API key
        run: |
          mkdir -p ~/.private_keys
          echo "${{ secrets.ASC_API_KEY_P8 }}" | base64 -d > ~/.private_keys/AuthKey_${{ secrets.ASC_API_KEY_ID }}.p8

      - name: Generate Mac App Store provisioning profile
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          jq -n \
            --arg key_id "$ASC_API_KEY_ID" \
            --arg issuer_id "$ASC_API_ISSUER_ID" \
            --rawfile key ~/.private_keys/AuthKey_${ASC_API_KEY_ID}.p8 \
            '{key_id: $key_id, issuer_id: $issuer_id, key: $key, in_house: false}' \
            > asc-api-key.json
          fastlane sigh \
            --app_identifier app.wohnly \
            --platform macos \
            --api_key_path asc-api-key.json \
            --filename Wohnly_MAS.mobileprovision

      - name: Re-sign, package, and upload to Mac App Store
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Extract .app from DMG
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "Error: No .dmg found in artifacts"
            exit 1
          fi
          echo "Mounting DMG: $DMG"
          hdiutil attach "$DMG" -nobrowse -mountpoint /tmp/wohnly-dmg
          APP=$(find /tmp/wohnly-dmg -name '*.app' -type d -maxdepth 1 | head -1)
          if [ -z "$APP" ]; then
            echo "Error: No .app found in DMG"
            hdiutil detach /tmp/wohnly-dmg
            exit 1
          fi
          # Copy to writable location
          cp -R "$APP" ./Wohnly.app
          hdiutil detach /tmp/wohnly-dmg
          APP="./Wohnly.app"
          echo "Found app: $APP"

          # Find the MAS signing identities
          MAS_APP_IDENTITY=$(security find-identity -v -p codesigning mas.keychain | grep "3rd Party Mac Developer Application" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          MAS_INSTALLER_IDENTITY=$(security find-identity -v mas.keychain | grep "3rd Party Mac Developer Installer" | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "App identity: $MAS_APP_IDENTITY"
          echo "Installer identity: $MAS_INSTALLER_IDENTITY"

          # Create MAS entitlements
          cat > entitlements.plist << 'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>com.apple.security.app-sandbox</key>
            <true/>
            <key>com.apple.security.network.client</key>
            <true/>
            <key>com.apple.security.files.user-selected.read-write</key>
            <true/>
            <key>com.apple.developer.applesignin</key>
            <array>
              <string>Default</string>
            </array>
          </dict>
          </plist>
          PLIST

          # Match the app's existing export-compliance setting. Setting this to
          # false avoids App Store Connect expecting an encryption compliance code
          # on the packaged macOS app.
          /usr/libexec/PlistBuddy -c "Add :ITSAppUsesNonExemptEncryption bool false" "$APP/Contents/Info.plist" 2>/dev/null || \
            /usr/libexec/PlistBuddy -c "Set :ITSAppUsesNonExemptEncryption false" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Delete :ITSEncryptionExportComplianceCode" "$APP/Contents/Info.plist" 2>/dev/null || true

          # Main bundles uploaded for Mac TestFlight/App Store must include a
          # Mac App Store provisioning profile before they are signed.
          cp Wohnly_MAS.mobileprovision "$APP/Contents/embedded.provisionprofile"
          chmod 644 "$APP/Contents/embedded.provisionprofile"
          security cms -D -i "$APP/Contents/embedded.provisionprofile" > embedded-profile.plist
          PROFILE_SIWA=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:com.apple.developer.applesignin:0" embedded-profile.plist 2>/dev/null || true)
          if [ "$PROFILE_SIWA" != "Default" ]; then
            echo "Error: provisioning profile is missing Sign in with Apple"
            exit 1
          fi

          # Re-sign the .app with MAS certificate
          codesign --keychain mas.keychain --deep --force --options runtime \
            --sign "$MAS_APP_IDENTITY" \
            --entitlements entitlements.plist \
            "$APP"

          echo "Re-signed .app for Mac App Store"

          # Package as .pkg with installer certificate
          PKG="Wohnly-${VERSION}.pkg"
          productbuild \
            --component "$APP" /Applications \
            --sign "$MAS_INSTALLER_IDENTITY" \
            --keychain mas.keychain \
            "$PKG"

          echo "Created signed pkg: $PKG"

          # Upload to App Store Connect
          xcrun altool --upload-app \
            --type macos \
            --file "$PKG" \
            --apiKey "$ASC_API_KEY_ID" \
            --apiIssuer "$ASC_API_ISSUER_ID" \
            --verbose

  # -- Windows: build MSIX for Microsoft Store (Store signs it for free) --

  build-windows:
    name: Build Windows MSIX
    needs: build-web
    outputs:
      should_submit: ${{ steps.windows-submit.outputs.should_submit }}
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: apps/mobile/dist

      - uses: actions/download-artifact@v8
        with:
          name: tauri-icons
          path: apps/desktop/tauri/icons

      - name: Download MSIX icon assets
        uses: actions/download-artifact@v8
        with:
          name: tauri-icons-msix
          path: apps/desktop/msix/assets

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --verbose

      - name: Get version
        id: version
        shell: bash
        run: echo "version=$(jq -r '.version' apps/desktop/tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Check whether Windows should be submitted
        id: windows-submit
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUBMIT: ${{ inputs.submit }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          SHOULD_SUBMIT=false
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SHOULD_SUBMIT="${MANUAL_SUBMIT:-false}"
          elif [ "$EVENT_NAME" = "push" ]; then
            CURRENT_VERSION="${{ steps.version.outputs.version }}"
            PREVIOUS_VERSION=$(git show "${BEFORE_SHA}:apps/desktop/tauri/tauri.conf.json" 2>/dev/null | jq -r '.version' || true)
            if [ -n "$PREVIOUS_VERSION" ] && [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              SHOULD_SUBMIT=true
            fi
          fi
          echo "should_submit=$SHOULD_SUBMIT" >> "$GITHUB_OUTPUT"
          echo "Windows Store submission: $SHOULD_SUBMIT"

      - name: Package as MSIX
        shell: powershell
        run: |
          apps/desktop/build-msix.ps1 -Version "${{ steps.version.outputs.version }}"

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: windows-msix
          path: apps/desktop/msix-output/Wohnly.msix
          retention-days: 30

  submit-windows:
    name: Submit to Microsoft Store
    needs: build-windows
    if: needs.build-windows.result == 'success' && needs.build-windows.outputs.should_submit == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-msix
          path: artifacts/windows

      - name: Setup Microsoft Store Developer CLI
        uses: microsoft/microsoft-store-apppublisher@v1.1

      - name: Configure Partner Center credentials
        shell: pwsh
        run: |
          msstore reconfigure `
            --tenantId "${{ secrets.PARTNER_CENTER_TENANT_ID }}" `
            --sellerId "${{ secrets.PARTNER_CENTER_SELLER_ID }}" `
            --clientId "${{ secrets.PARTNER_CENTER_CLIENT_ID }}" `
            --clientSecret "${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}"

      - name: Publish MSIX to Microsoft Store
        shell: pwsh
        run: |
          msstore publish "${{ github.workspace }}\artifacts\windows\Wohnly.msix" -id 9P5JTRSRMJPB

  # -- GitHub Release: macOS download + Microsoft Store link for Windows --

  release:
    name: Create GitHub release
    needs: [build-macos]
    if: needs.build-macos.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Download macOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-build
          path: artifacts/macos

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' apps/desktop/tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts to fixed filenames for stable download URLs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p artifacts/release

          # macOS DMG
          DMG=$(find artifacts/macos -name '*.dmg' 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "artifacts/release/Wohnly-macOS.dmg"
            cp "$DMG" "artifacts/release/Wohnly-${VERSION}-macOS.dmg"
          fi

          # macOS update bundle (.app.tar.gz + signature)
          MAC_TAR=$(find artifacts/macos -name '*.app.tar.gz' 2>/dev/null | head -1)
          if [ -n "$MAC_TAR" ]; then
            cp "$MAC_TAR" "artifacts/release/Wohnly-macOS.app.tar.gz"
          fi
          MAC_SIG=$(find artifacts/macos -name '*.app.tar.gz.sig' 2>/dev/null | head -1)
          if [ -n "$MAC_SIG" ]; then
            cp "$MAC_SIG" "artifacts/release/Wohnly-macOS.app.tar.gz.sig"
          fi

          ls -la artifacts/release/

      - name: Generate updater manifest (latest.json)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/t-scheiber/wohnly-app/releases/download/desktop-latest"

          MAC_SIG=""
          if [ -f "artifacts/release/Wohnly-macOS.app.tar.gz.sig" ]; then
            MAC_SIG=$(cat "artifacts/release/Wohnly-macOS.app.tar.gz.sig")
          fi

          # macOS-only updater (Windows updates via Microsoft Store)
          PLATFORMS="{}"
          if [ -n "$MAC_SIG" ]; then
            MAC_ENTRY="\"signature\":$(echo "$MAC_SIG" | jq -Rs .),\"url\":\"${BASE}/Wohnly-macOS.app.tar.gz\""
            PLATFORMS="{\"darwin-x86_64\":{${MAC_ENTRY}},\"darwin-aarch64\":{${MAC_ENTRY}}}"
          fi

          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, pub_date: $pub_date, platforms: $platforms}' \
            > artifacts/release/latest.json

          echo "Generated latest.json:"
          cat artifacts/release/latest.json

      - name: Delete previous 'latest' release if exists
        run: gh release delete desktop-latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous 'latest' tag if exists
        run: git push origin :refs/tags/desktop-latest 2>/dev/null || true

      - name: Create 'latest' release (always up to date)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-latest
          name: Wohnly Desktop (Latest)
          body: |
            **Latest desktop build — v${{ steps.version.outputs.version }}**

            | Platform | Download |
            |---|---|
            | macOS | [Mac App Store](https://apps.apple.com/app/wohnly/id6761035211) |
            | Windows | [Microsoft Store](https://apps.microsoft.com/detail/9P5JTRSRMJPB) |
          files: |
            artifacts/release/Wohnly-macOS.dmg
            artifacts/release/Wohnly-macOS.app.tar.gz
            artifacts/release/Wohnly-macOS.app.tar.gz.sig
            artifacts/release/latest.json
          make_latest: true
          prerelease: false

      - name: Create versioned release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Wohnly Desktop v${{ steps.version.outputs.version }}
          files: |
            artifacts/release/Wohnly-${{ steps.version.outputs.version }}-*
          draft: true
