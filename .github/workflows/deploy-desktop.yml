name: Build & Deploy Desktop (macOS + Windows)

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/lib/**"
      - "apps/mobile/components/**"
      - "apps/mobile/constants/**"
      - "apps/mobile/hooks/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/i18n/**"
      - "apps/desktop/**"
      - "packages/**"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - all
          - macos
          - windows
      submit:
        description: "Submit to stores after build"
        required: false
        type: boolean
        default: false

jobs:
  build-web:
    name: Build web export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install sharp for icon generation
        run: npm install --no-save sharp

      - name: Generate Tauri icons
        run: node apps/desktop/generate-icons.mjs

      - name: Export web build
        working-directory: apps/mobile
        run: npx expo export --platform web

      - name: Add PWA assets
        working-directory: apps/desktop
        run: bash build-pwa.sh

      - name: Upload web dist
        uses: actions/upload-artifact@v5
        with:
          name: web-dist
          path: apps/mobile/dist
          retention-days: 1

      - name: Upload Tauri icons
        uses: actions/upload-artifact@v5
        with:
          name: tauri-icons
          path: apps/desktop/tauri/icons
          retention-days: 1

  # -- macOS: build, sign, notarize, optionally submit to Mac App Store --

  build-macos:
    name: Build & sign macOS
    needs: build-web
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'macos'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/mobile/dist

      - uses: actions/download-artifact@v5
        with:
          name: tauri-icons
          path: apps/desktop/tauri/icons

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri

      - name: Import Apple signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import certificate.p12 -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12

      - name: Build Tauri app (signed)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --verbose

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v5
        with:
          name: macos-build
          path: |
            apps/desktop/tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/tauri/target/release/bundle/macos/*.app
            apps/desktop/tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/tauri/target/release/bundle/macos/*.app.tar.gz.sig
          retention-days: 30

  submit-macos:
    name: Submit to Mac App Store
    needs: build-macos
    if: >
      github.event_name == 'workflow_dispatch' &&
      inputs.submit &&
      (inputs.platform == 'all' || inputs.platform == 'macos')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: macos-build
          path: artifacts/macos

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' apps/desktop/tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Upload to App Store Connect
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          DMG=$(find artifacts/macos -name '*.dmg' | head -1)
          if [ -z "$DMG" ]; then
            echo "No .dmg found, looking for .app"
            APP=$(find artifacts/macos -name '*.app' -type d | head -1)
            # Create a pkg from the .app for App Store submission
            productbuild --component "$APP" /Applications "Wohnly-${{ steps.version.outputs.version }}.pkg"
            PKG="Wohnly-${{ steps.version.outputs.version }}.pkg"
          else
            PKG="$DMG"
          fi

          xcrun notarytool submit "$PKG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait

          echo "Notarization complete. Submitting to App Store Connect..."

          xcrun altool --upload-app \
            --type macos \
            --file "$PKG" \
            --apiKey "${{ secrets.ASC_API_KEY_ID }}" \
            --apiIssuer "${{ secrets.ASC_API_ISSUER_ID }}" \
            --verbose

  # -- Windows: build, sign, optionally submit to Microsoft Store --

  build-windows:
    name: Build Windows
    needs: build-web
    if: >
      github.event_name == 'push' ||
      inputs.platform == 'all' ||
      inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v5
        with:
          name: web-dist
          path: apps/mobile/dist

      - uses: actions/download-artifact@v5
        with:
          name: tauri-icons
          path: apps/desktop/tauri/icons

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/tauri

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: npx tauri
          args: --verbose

      # Optional: Sign Windows installers with Azure Trusted Signing.
      # Requires secrets: AZURE_TENANT_ID, AZURE_CLIENT_ID, AZURE_CLIENT_SECRET,
      #                   AZURE_SIGNING_ACCOUNT, AZURE_CERT_PROFILE
      # See: https://learn.microsoft.com/en-us/azure/trusted-signing/
      - name: Sign Windows installers
        if: env.AZURE_TENANT_ID != ''
        uses: azure/trusted-signing-action@v0.5.0
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          azure-client-id: ${{ secrets.AZURE_CLIENT_ID }}
          azure-client-secret: ${{ secrets.AZURE_CLIENT_SECRET }}
          endpoint: https://eus.codesigning.azure.net/
          trusted-signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ secrets.AZURE_CERT_PROFILE }}
          files-folder: apps/desktop/tauri/target/release/bundle/nsis
          files-folder-filter: exe

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v5
        with:
          name: windows-build
          path: |
            apps/desktop/tauri/target/release/bundle/nsis/*.exe
            apps/desktop/tauri/target/release/bundle/nsis/*.nsis.zip
            apps/desktop/tauri/target/release/bundle/nsis/*.nsis.zip.sig
          retention-days: 30

  # -- GitHub Release: always runs after builds complete --

  release:
    name: Create GitHub release
    needs: [build-macos, build-windows]
    if: always() && (needs.build-macos.result == 'success' || needs.build-windows.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Download macOS artifacts
        if: needs.build-macos.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: macos-build
          path: artifacts/macos

      - name: Download Windows artifacts
        if: needs.build-windows.result == 'success'
        uses: actions/download-artifact@v5
        with:
          name: windows-build
          path: artifacts/windows

      - name: Get version
        id: version
        run: echo "version=$(jq -r '.version' apps/desktop/tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

      - name: Rename artifacts to fixed filenames for stable download URLs
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p artifacts/release

          # macOS DMG
          DMG=$(find artifacts/macos -name '*.dmg' 2>/dev/null | head -1)
          if [ -n "$DMG" ]; then
            cp "$DMG" "artifacts/release/Wohnly-macOS.dmg"
            cp "$DMG" "artifacts/release/Wohnly-${VERSION}-macOS.dmg"
          fi

          # macOS update bundle (.app.tar.gz + signature)
          MAC_TAR=$(find artifacts/macos -name '*.app.tar.gz' 2>/dev/null | head -1)
          if [ -n "$MAC_TAR" ]; then
            cp "$MAC_TAR" "artifacts/release/Wohnly-macOS.app.tar.gz"
          fi
          MAC_SIG=$(find artifacts/macos -name '*.app.tar.gz.sig' 2>/dev/null | head -1)
          if [ -n "$MAC_SIG" ]; then
            cp "$MAC_SIG" "artifacts/release/Wohnly-macOS.app.tar.gz.sig"
          fi

          # Windows EXE (NSIS)
          EXE=$(find artifacts/windows -name '*-setup.exe' -o -name '*Setup.exe' 2>/dev/null | head -1)
          if [ -n "$EXE" ]; then
            cp "$EXE" "artifacts/release/Wohnly-Windows-Setup.exe"
            cp "$EXE" "artifacts/release/Wohnly-${VERSION}-Windows-Setup.exe"
          fi

          # Windows update bundle (.nsis.zip + signature)
          WIN_ZIP=$(find artifacts/windows -name '*.nsis.zip' 2>/dev/null | head -1)
          if [ -n "$WIN_ZIP" ]; then
            cp "$WIN_ZIP" "artifacts/release/Wohnly-Windows-Setup.nsis.zip"
          fi
          WIN_SIG=$(find artifacts/windows -name '*.nsis.zip.sig' 2>/dev/null | head -1)
          if [ -n "$WIN_SIG" ]; then
            cp "$WIN_SIG" "artifacts/release/Wohnly-Windows-Setup.nsis.zip.sig"
          fi

          ls -la artifacts/release/

      - name: Generate updater manifest (latest.json)
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PUB_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          BASE="https://github.com/t-scheiber/wohnly-app/releases/download/desktop-latest"

          # Read signatures (empty string if not found)
          WIN_SIG=""
          MAC_SIG=""
          if [ -f "artifacts/release/Wohnly-Windows-Setup.nsis.zip.sig" ]; then
            WIN_SIG=$(cat "artifacts/release/Wohnly-Windows-Setup.nsis.zip.sig")
          fi
          if [ -f "artifacts/release/Wohnly-macOS.app.tar.gz.sig" ]; then
            MAC_SIG=$(cat "artifacts/release/Wohnly-macOS.app.tar.gz.sig")
          fi

          # Build platforms JSON
          PLATFORMS="{"
          FIRST=true

          if [ -n "$WIN_SIG" ]; then
            PLATFORMS="$PLATFORMS\"windows-x86_64\":{\"signature\":$(echo "$WIN_SIG" | jq -Rs .),\"url\":\"${BASE}/Wohnly-Windows-Setup.nsis.zip\"}"
            FIRST=false
          fi

          if [ -n "$MAC_SIG" ]; then
            [ "$FIRST" = false ] && PLATFORMS="$PLATFORMS,"
            MAC_ENTRY="\"signature\":$(echo "$MAC_SIG" | jq -Rs .),\"url\":\"${BASE}/Wohnly-macOS.app.tar.gz\""
            PLATFORMS="$PLATFORMS\"darwin-x86_64\":{${MAC_ENTRY}},\"darwin-aarch64\":{${MAC_ENTRY}}"
          fi

          PLATFORMS="$PLATFORMS}"

          # Write latest.json
          jq -n \
            --arg version "$VERSION" \
            --arg pub_date "$PUB_DATE" \
            --argjson platforms "$PLATFORMS" \
            '{version: $version, pub_date: $pub_date, platforms: $platforms}' \
            > artifacts/release/latest.json

          echo "Generated latest.json:"
          cat artifacts/release/latest.json

      - name: Delete previous 'latest' release if exists
        run: gh release delete desktop-latest --yes 2>/dev/null || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Delete previous 'latest' tag if exists
        run: git push origin :refs/tags/desktop-latest 2>/dev/null || true

      - name: Create 'latest' release (always up to date)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-latest
          name: Wohnly Desktop (Latest)
          body: |
            **Latest desktop build — v${{ steps.version.outputs.version }}**

            | Platform | Download |
            |---|---|
            | macOS | [Wohnly-macOS.dmg](https://github.com/t-scheiber/wohnly-app/releases/download/desktop-latest/Wohnly-macOS.dmg) |
            | Windows | [Wohnly-Windows-Setup.exe](https://github.com/t-scheiber/wohnly-app/releases/download/desktop-latest/Wohnly-Windows-Setup.exe) |
          files: |
            artifacts/release/Wohnly-macOS.dmg
            artifacts/release/Wohnly-macOS.app.tar.gz
            artifacts/release/Wohnly-macOS.app.tar.gz.sig
            artifacts/release/Wohnly-Windows-Setup.exe
            artifacts/release/Wohnly-Windows-Setup.nsis.zip
            artifacts/release/Wohnly-Windows-Setup.nsis.zip.sig
            artifacts/release/latest.json
          make_latest: true
          prerelease: false

      - name: Create versioned release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: desktop-v${{ steps.version.outputs.version }}
          name: Wohnly Desktop v${{ steps.version.outputs.version }}
          files: |
            artifacts/release/Wohnly-${{ steps.version.outputs.version }}-*
          draft: true
