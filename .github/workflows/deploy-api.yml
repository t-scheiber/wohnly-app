name: Deploy API

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/shared/**'
      - 'deploy/**'
      - '.github/workflows/deploy-api.yml'

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED != 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/wohnly_deploy -o StrictHostKeyChecking=no"
            cd /var/www/wohnly
            git stash 2>/dev/null || true
            git fetch origin main
            git reset --hard origin/main
            npm ci
            cd apps/api
            npx prisma generate
            node -e 'require("../../node_modules/.prisma/client/query_compiler_fast_bg.wasm-base64.js")'
            npx prisma db push --accept-data-loss
            cd ../..
            pm2 delete wohnly-api 2>/dev/null || true
            pm2 start deploy/pm2.api.config.cjs --only wohnly-api --update-env
            pm2 save

            # Install health check cron (every 2 minutes)
            chmod +x deploy/healthcheck.sh
            CRON_CMD="*/2 * * * * /var/www/wohnly/deploy/healthcheck.sh >> /var/log/wohnly-health.log 2>&1"
            ( crontab -l 2>/dev/null | grep -v "healthcheck.sh" ; echo "$CRON_CMD" ) | crontab -
