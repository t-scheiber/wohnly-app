name: Deploy Web

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - 'packages/shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-web.yml'

jobs:
  deploy-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Install dependencies (root workspace)
        run: npm ci

      - name: Export web build
        run: npx expo export --platform web
        working-directory: apps/mobile

      - name: Inject AdSense script
        run: node scripts/inject-adsense.mjs
        working-directory: apps/mobile

      - name: Upload web build to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "apps/mobile/dist/*"
          target: "/var/www/wohnly-web"
          strip_components: 3
          overwrite: true
