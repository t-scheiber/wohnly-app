name: Debug API

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/wohnly

            echo "=== CHECK DEPLOY DIR ==="
            ls -la deploy/ 2>&1 || echo "deploy/ directory missing"
            ls -la apps/api/ | head -5

            echo ""
            echo "=== GIT STATUS ==="
            git log --oneline -3
            git status --short | head -10

            echo ""
            echo "=== TRY GIT PULL ==="
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/wohnly_deploy -o StrictHostKeyChecking=no"
            git pull origin main

            echo ""
            echo "=== CHECK DEPLOY DIR AGAIN ==="
            ls -la deploy/ 2>&1 || echo "deploy/ still missing"

            echo ""
            echo "=== START API ==="
            npm ci
            npx prisma generate --schema=apps/api/prisma/schema.prisma
            npx prisma db push --schema=apps/api/prisma/schema.prisma --accept-data-loss
            pm2 delete wohnly-api 2>/dev/null || true
            pm2 start deploy/pm2.api.config.cjs --only wohnly-api --update-env
            pm2 save

            sleep 5

            echo ""
            echo "=== PM2 STATUS ==="
            pm2 status

            echo ""
            echo "=== PM2 LOGS ==="
            pm2 logs wohnly-api --lines 30 --nostream

            echo ""
            echo "=== PORT CHECK ==="
            ss -tlnp | grep 3001 || echo "Nothing on port 3001"
