name: Debug API

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Fix and restart API
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/wohnly
            export GIT_SSH_COMMAND="ssh -i /root/.ssh/wohnly_deploy -o StrictHostKeyChecking=no"

            echo "=== FORCE PULL ==="
            git stash
            git fetch origin main
            git reset --hard origin/main
            git log --oneline -3

            echo ""
            echo "=== INSTALL DEPS ==="
            npm ci

            echo ""
            echo "=== PRISMA ==="
            cd apps/api
            npx prisma generate
            npx prisma db push --accept-data-loss
            cd ../..

            echo ""
            echo "=== START API ==="
            pm2 delete wohnly-api 2>/dev/null || true
            pm2 start deploy/pm2.api.config.cjs --only wohnly-api --update-env
            pm2 save
            sleep 5

            echo ""
            echo "=== PM2 STATUS ==="
            pm2 status

            echo ""
            echo "=== PM2 LOGS ==="
            pm2 logs wohnly-api --lines 30 --nostream

            echo ""
            echo "=== PORT CHECK ==="
            ss -tlnp | grep 3001 || echo "Nothing on port 3001"
