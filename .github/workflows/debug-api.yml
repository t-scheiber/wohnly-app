name: Debug API

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Restart API and check logs
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /var/www/wohnly

            echo "=== ATTEMPTING PM2 START ==="
            pm2 delete wohnly-api 2>/dev/null || true
            pm2 start deploy/pm2.api.config.cjs --only wohnly-api --update-env
            pm2 save

            echo ""
            echo "=== WAIT 5s FOR STARTUP ==="
            sleep 5

            echo ""
            echo "=== PM2 STATUS ==="
            pm2 status

            echo ""
            echo "=== PM2 LOGS (last 80 lines) ==="
            pm2 logs wohnly-api --lines 80 --nostream

            echo ""
            echo "=== CHECK PORT 3001 ==="
            ss -tlnp | grep 3001 || echo "Nothing on port 3001"
