name: Build & Submit Mobile

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:
    inputs:
      platform:
        description: "Platform to build"
        required: true
        type: choice
        options:
          - all
          - ios
          - android
      submit:
        description: "Submit to stores after build"
        required: false
        type: boolean
        default: false
      skip_build:
        description: "Skip build and submit the latest existing EAS build"
        required: false
        type: boolean
        default: false
      android_submit_profile:
        description: "Android destination"
        required: true
        type: choice
        default: closed
        options:
          - closed
          - production

jobs:
  release-check:
    name: Check mobile release version
    runs-on: ubuntu-latest
    outputs:
      should_release: ${{ steps.release-check.outputs.should_release }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check whether the app version changed
        id: release-check
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          SHOULD_RELEASE=true
          if [ "$EVENT_NAME" = "push" ]; then
            CURRENT_VERSION=$(jq -r '.expo.version' apps/mobile/app.json)
            PREVIOUS_VERSION=$(git show "${BEFORE_SHA}:apps/mobile/app.json" 2>/dev/null | jq -r '.expo.version' || true)
            SHOULD_RELEASE=false
            if [ -n "$PREVIOUS_VERSION" ] && [ "$CURRENT_VERSION" != "$PREVIOUS_VERSION" ]; then
              SHOULD_RELEASE=true
            fi
          fi
          echo "should_release=$SHOULD_RELEASE" >> "$GITHUB_OUTPUT"
          echo "Mobile store release: $SHOULD_RELEASE"

  ios:
    name: Build & submit iOS
    needs: release-check
    if: >
      needs.release-check.outputs.should_release == 'true' &&
      (github.event_name == 'push' || inputs.platform == 'ios' || inputs.platform == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build iOS
        if: github.event_name == 'push' || !inputs.skip_build
        working-directory: apps/mobile
        run: eas build --profile production --platform ios --non-interactive
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"

      - name: Write App Store Connect API key
        if: github.event_name == 'push' || inputs.submit
        run: echo "${{ secrets.ASC_API_KEY_P8 }}" | base64 -d > AuthKey_C5QRM2S8XQ.p8

      - name: Submit iOS to App Store
        if: github.event_name == 'push' || inputs.submit
        working-directory: apps/mobile
        run: eas submit --profile production --platform ios --non-interactive --latest

  android:
    name: Build & submit Android
    needs: release-check
    if: >
      needs.release-check.outputs.should_release == 'true' &&
      (github.event_name == 'push' || inputs.platform == 'android' || inputs.platform == 'all')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - name: Setup EAS
        uses: expo/expo-github-action@v9
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Build Android
        if: github.event_name == 'push' || !inputs.skip_build
        working-directory: apps/mobile
        run: eas build --profile production --platform android --non-interactive
        env:
          EXPO_NO_CAPABILITY_SYNC: "1"

      - name: Write Google Service Account key
        if: github.event_name == 'push' || inputs.submit
        run: echo "${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON_B64 }}" | base64 -d > eas-submit_serviceaccount.json

      - name: Submit Android to Play Store
        if: github.event_name == 'push' || inputs.submit
        working-directory: apps/mobile
        run: eas submit --profile "${{ inputs.android_submit_profile || 'closed' }}" --platform android --non-interactive --latest
