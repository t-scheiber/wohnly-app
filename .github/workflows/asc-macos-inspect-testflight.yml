name: Inspect macOS TestFlight readiness

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: ASC app ID
        required: true
        default: "6761035211"
      build_id:
        description: Processed ASC build ID
        required: true
        default: "39330cad-cbdf-40e0-b508-cbacc651a3e7"

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Query TestFlight readiness
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          APP_ID: ${{ inputs.app_id }}
          BUILD_ID: ${{ inputs.build_id }}
        run: |
          set -euo pipefail
          pip3 install --quiet PyJWT cryptography
          python3 <<'PY'
          import base64
          import json
          import os
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import jwt

          key_id = os.environ["ASC_API_KEY_ID"]
          issuer = os.environ["ASC_API_ISSUER_ID"]
          raw_key = base64.b64decode(os.environ["ASC_API_KEY_P8"]).decode()
          app_id = os.environ["APP_ID"]
          build_id = os.environ["BUILD_ID"]

          token = jwt.encode(
              {
                  "iss": issuer,
                  "iat": int(time.time()),
                  "exp": int(time.time()) + 600,
                  "aud": "appstoreconnect-v1",
              },
              raw_key,
              algorithm="ES256",
              headers={"kid": key_id, "typ": "JWT"},
          )

          def get(path, query=None):
              suffix = "?" + urllib.parse.urlencode(query) if query else ""
              request = urllib.request.Request(
                  f"https://api.appstoreconnect.apple.com{path}{suffix}",
                  headers={"Authorization": f"Bearer {token}"},
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", errors="replace")
                  raise RuntimeError(f"GET {path} failed with HTTP {error.code}: {body[:500]}")

          build = get(f"/v1/builds/{build_id}")["data"]
          beta_detail = get(f"/v1/buildBetaDetails/{build_id}")["data"]
          groups_payload = get("/v1/betaGroups", {"filter[app]": app_id, "limit": "200"})

          groups = []
          for group in groups_payload.get("data", []):
              attrs = group.get("attributes", {})
              if not attrs.get("isInternal"):
                  continue
              tester_count = len(
                  get(
                      f"/v1/betaGroups/{group['id']}/relationships/betaTesters",
                      {"limit": "200"},
                  ).get("data", [])
              )
              group_build_ids = {
                  item["id"]
                  for item in get(
                      f"/v1/betaGroups/{group['id']}/builds",
                      {"limit": "200"},
                  ).get("data", [])
              }
              groups.append(
                  {
                      "id": group["id"],
                      "name": attrs.get("name"),
                      "isInternal": True,
                      "testerCount": tester_count,
                      "containsBuild": build_id in group_build_ids,
                  }
              )

          result = {
              "build": {
                  "id": build["id"],
                  "version": build.get("attributes", {}).get("version"),
                  "processingState": build.get("attributes", {}).get("processingState"),
                  "expired": build.get("attributes", {}).get("expired"),
                  "internalBuildState": beta_detail.get("attributes", {}).get("internalBuildState"),
                  "externalBuildState": beta_detail.get("attributes", {}).get("externalBuildState"),
                  "autoNotifyEnabled": beta_detail.get("attributes", {}).get("autoNotifyEnabled"),
              },
              "internalGroups": groups,
          }
          print(json.dumps(result, sort_keys=True))
          PY
