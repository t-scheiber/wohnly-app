[package]
name = "wohnly-desktop"
version = "1.3.10"
description = "Wohnly - Household Manager"
authors = ["Thomas Scheiber"]
edition = "2021"

[features]
default = []
# Mac App Store builds must not register an external update mechanism.
mas = []

[lib]
name = "wohnly_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "native-tls"] }
tauri-plugin-single-instance = { version = "2.4.2", features = ["deep-link"] }
tauri-plugin-auth-session = "0.2.2"
tauri-plugin-iap = "0.10.0-rc.8"
tauri-plugin-siwa = "1.0.0"
